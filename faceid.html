<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Kestrel</title>
  <meta name="apple-mobile-web-app-title" content="Kestrel">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css?v=18">
  <meta name="theme-color" content="#000000">
  <style>
    /* sampled for the status bar strip: black, so the strip, the island and the card read as one shape */
    html, body { background: #000; }
    @media (min-width: 480px) { body { background: #0a0a0a; } }
  </style>
</head>
<body>
<div class="phone" id="phone">
  <div class="intro dim" id="intro">
    <div class="intro-dim"></div>
    <div class="faceid" id="faceid">
      <div class="island-card">
        <svg class="fid-glyph" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 30 V20 a12 12 0 0 1 12 -12 H30"/>
          <path d="M70 8 H80 a12 12 0 0 1 12 12 V30"/>
          <path d="M92 70 V80 a12 12 0 0 1 -12 12 H70"/>
          <path d="M30 92 H20 a12 12 0 0 1 -12 -12 V70"/>
          <g class="fid-face">
            <path d="M34 36 V45"/>
            <path d="M66 36 V45"/>
            <path d="M51 36 V56 a5 5 0 0 1 -5 5"/>
            <path d="M34 68 q16 13 32 0"/>
          </g>
        </svg>
        <div class="fid-gyro">
          <div class="fid-glow"></div>
          <div class="fid-r fid-r1"></div>
          <div class="fid-r fid-r2"></div>
        </div>
        <svg class="fid-check" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <circle class="fid-ring-ok" cx="50" cy="50" r="44"/>
          <path class="fid-tick" d="M29 51 L44 66 L72 36"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="status-bar">
    <div class="island"></div>
    <span class="status-time" id="statusTime">11:18</span>
    <img class="status-icons" src="assets/status-icons.png" alt="">
  </div>
</div>
<script>
  (function () {
    var el = document.getElementById('statusTime');
    var tick = function () { var d = new Date(); el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
    tick(); setInterval(tick, 1000);
  })();
  // Dynamic Island Face ID: show -> scan -> ok -> hide -> home. ?state=faceid|facescan|faceok freezes a step.
  var faceid = document.getElementById('faceid');
  var params = new URLSearchParams(location.search);
  var freeze = { faceid: ['show'], facescan: ['show', 'scan'], faceok: ['show', 'scan', 'ok'] }[params.get('state')];
  if (freeze) {
    freeze.forEach(function (c) { faceid.classList.add(c); });
  } else {
    var t = function (ms, fn) { setTimeout(fn, ms); };
    t(60,   function () { faceid.classList.add('show'); });
    t(750,  function () { faceid.classList.add('scan'); });
    t(1200, function () { faceid.classList.add('ok'); });
    t(1600, function () { faceid.classList.add('hide'); });
    t(1800, function () {
      try { sessionStorage.setItem('kestrel.booted', '1'); } catch (e) {}
      location.replace('index.html');
    });
  }
</script>
</body>
</html>
